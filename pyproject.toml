[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "1.0.0"
description = "私有文档 Agentic-RAG：CRAG 检索回路 + 证据充分性判定 + 幻觉治理 + MCP 工具编排（AI 服务层）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "httpx>=0.25",
    "loguru>=0.7",
    "langgraph>=0.2",
    "pymilvus>=2.4",
    "elasticsearch>=8.0",
    "redis>=5.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# 运行时层 agent-harness：Provider、可观测与上下文计数在 import 时即需要它，
# 执行循环（HarnessLoop）缺失时应用回退到内置手动循环。
# 本地开发更推荐并列两仓后 `pip install -e ../agent-harness`（离线、可改）。
runtime = ["agent-harness @ git+https://github.com/nengyong-liang/agent-harness.git@main"]
# 本地向量与精排模型（首次运行需下载权重）
embeddings = [
    "sentence-transformers>=2.5",
    "torch>=2.1",
    "transformers>=4.35",
    "scikit-learn>=1.3",
]
# 文档解析
parsers = ["PyMuPDF>=1.24", "python-docx>=1.1"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
